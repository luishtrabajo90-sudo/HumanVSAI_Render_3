{% extends "base.html" %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}
<main class="wrap admin-login">
  <div class="brand">
    <div class="logo"><span class="dot"></span> ¿Olvidaste tu contraseña?</div>
    <a class="btn ghost small" href="{{ url_for('admin.login') }}">Volver al login</a>
  </div>
  <section class="panel admin-panel">
    <p class="admin-help">Esta opción está disponible únicamente para administradores registrados.</p>
    {% if message %}<div class="flash success" role="status">{{ message }}</div>{% endif %}
    <form class="admin-form" method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="resetUsername">Usuario
        <input id="resetUsername" type="text" name="username" required maxlength="40" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <div class="cta-row admin-cta">
        <button class="btn" type="submit">Solicitar restablecimiento</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
